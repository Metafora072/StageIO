name: build-test

on:
  push:
    paths:
      - "fs/xfs/**"
      - ".github/workflows/build-test.yml"
  pull_request:
    paths:
      - "fs/xfs/**"
      - ".github/workflows/build-test.yml"

jobs:
  build-xfs:
    name: Build XFS
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            flex \
            libelf-dev \
            libssl-dev

      - name: Configure kernel
        run: |
          make defconfig
          ./scripts/config --disable WERROR
          ./scripts/config --enable XFS_FS
          make olddefconfig

      - name: Build fs/xfs
        run: |
          make -j"$(nproc)" fs/xfs/
